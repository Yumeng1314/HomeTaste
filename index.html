
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HomeTaste - 私房味道同步</title>
    
    <meta name="theme-color" content="#022c22">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HomeTaste">
    
    <!-- Artistic Abstract Icon: Minimalist organic lines representing flavor and flow -->
    <link rel="apple-touch-icon" href="https://img.icons8.com/nolan/512/potted-plant.png">
    <link rel="icon" type="image/png" href="https://img.icons8.com/nolan/192/potted-plant.png">
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Playfair+Display:ital,wght@1,900&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background-color: #fcfdfe;
            overflow-x: hidden;
            overflow-y: auto;
        }
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #022c22;
            background: white;
            position: fixed;
            inset: 0;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .loading-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #10b981;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin-bottom: 32px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "firebase/app": "https://esm.sh/firebase@10.8.0/app",
    "firebase/database": "https://esm.sh/firebase@10.8.0/database",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "html2canvas": "https://esm.sh/html2canvas@1.4.1",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root">
        <div class="loading-screen" id="loading-screen">
            <div class="spinner"></div>
            <div id="status-text" style="font-weight: 900; letter-spacing: 0.1em; text-align: center; padding: 0 32px; font-size: 11px; color: #94a3b8; text-transform: uppercase;">正在为您准备 HomeTaste 的美味时刻...</div>
        </div>
    </div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
