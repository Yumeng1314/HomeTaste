
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>家味同享 - 家庭食谱与库存管理</title>
    
    <!-- PWA 配置 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    
    <!-- iOS 专用设置 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="家味同享">
    <link rel="apple-touch-icon" href="https://picsum.photos/seed/appicon/192">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto+Sans+SC', sans-serif;
            background-color: #fcfdfe;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
            margin: 0;
        }
        ::-webkit-scrollbar {
            display: none;
        }
        /* 加载动画 */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #059669;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<script>
    // 关键修复：防止移动端浏览器因为找不到 process 变量而报错白屏
    window.process = window.process || { env: { API_KEY: "" } };
</script>
</head>
<body>
    <div id="root">
        <div class="loading-screen">
            <div style="font-size: 40px; margin-bottom: 20px;">🍳</div>
            <div style="font-weight: 900; letter-spacing: 2px;">正在开启家味之旅...</div>
        </div>
    </div>
